apiVersion: apps/v1
kind: Deployment
metadata:
  name: catsdogs-api
  labels:
    app: catsdogs-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catsdogs-api
  template:
    metadata:
      labels:
        app: catsdogs-api
    spec:
      containers:
        - name: api-container
          image: catsdogs-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1.0"
              memory: "1Gi"
            requests:
              cpu: "0.5"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catsdogs-service
  namespace: default
  labels:
    app: catsdogs-api
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: catsdogs-api
